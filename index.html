          ]},
          { level: "كتب الاعتماد والفتوى (القول الفصل)", items: [
            { name: "المنتهى (منتهى الإرادات)", author: "ابن النجار", desc: "القول الفصل والمعتمد النهائي في المذهب عند الاختلاف." },
            { name: "الإقناع لطالب الانتفاع", author: "الحجاوي", desc: "كتاب جامع لأحكام المذهب المعتمدة، كثير التفريعات." },
            { name: "كشاف القناع", author: "منصور البهوتي", desc: "شرح الإقناع، وهو أهم مرجع للقضاء والإفتاء في العصر المتأخر." }
          ]}
        ];

        // --- المكون الرئيسي للموقع ---
        function HanbaliIntro() {
          const [enteredSite, setEnteredSite] = useState(false);
          const [activeTab, setActiveTab] = useState('scholars');
          const [selectedScholar, setSelectedScholar] = useState(null);
          const [searchQuery, setSearchQuery] = useState('');

          const filteredScholars = useMemo(() => {
            return scholarsData.filter(s => s.name.includes(searchQuery) || s.worksImpact.includes(searchQuery));
          }, [searchQuery]);

          const handleTabChange = (tab) => {
            setSelectedScholar(null);
            setActiveTab(tab);
            window.scrollTo(0, 0);
          };

          // شاشة الدخول (Splash Screen)
          if (!enteredSite) {
            return (
              <div className="min-h-screen bg-[#0A261A] text-white font-['Tajawal',_sans-serif] relative overflow-hidden flex flex-col items-center justify-center">
                <div className="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] bg-[#124930] rounded-full blur-[120px] opacity-60"></div>
                
                <div className="relative z-10 w-full max-w-5xl px-4 py-12 transition-all duration-1000">
                  <div className="text-center mb-10">
                    <h1 className="text-2xl md:text-3xl text-[#D4AF37] mb-4 font-bold tracking-widest">الـمَدْخَلُ إلَى مَذْهَبِ</h1>
                    <h2 className="text-5xl md:text-7xl font-extrabold text-white mb-6 drop-shadow-lg leading-tight">{imamAhmadData.name}</h2>
                    <p className="text-xl md:text-2xl text-[#A7C8B6] font-medium">({imamAhmadData.title})</p>
                    <div className="mt-6 flex justify-center gap-4 text-[#D4AF37] font-bold text-lg">
                      <span className="bg-[#124930]/50 border border-[#1C6B46] px-4 py-1.5 rounded-full">الميلاد: {imamAhmadData.birth}</span>
                      <span className="bg-[#124930]/50 border border-[#1C6B46] px-4 py-1.5 rounded-full">الوفاة: {imamAhmadData.death}</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12 font-['Amiri',_serif]">
                    {imamAhmadData.sections.map((sec, idx) => (
                      <div key={idx} className="bg-[#0F3624]/80 backdrop-blur-sm border border-[#1C6B46]/50 p-6 rounded-2xl shadow-xl hover:border-[#D4AF37]/50 transition-colors">
                        <h3 className="text-2xl font-bold text-[#D4AF37] mb-3 flex items-center gap-2">
                           <i className="fas fa-landmark"></i> {sec.title}
                        </h3>
                        <p className="text-[#E0ECE5] text-lg leading-loose text-justify">{sec.content}</p>
                      </div>
                    ))}
                  </div>

                  <div className="flex justify-center">
                    <button 
                      onClick={() => setEnteredSite(true)}
                      className="group relative inline-flex items-center justify-center gap-3 bg-gradient-to-r from-[#D4AF37] to-[#B8860B] text-[#0A261A] font-bold text-xl px-10 py-5 rounded-full shadow-[0_0_30px_rgba(212,175,55,0.3)] hover:scale-105 transition-transform"
                    >
                      الدخول إلى الموسوعة المرجعية للمذهب
                      <i className="fas fa-arrow-circle-down text-2xl group-hover:translate-y-1 transition-transform"></i>
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          // الواجهة الرئيسية
          return (
            <div className="min-h-screen bg-[#F5F8F6] text-[#1A3326] font-['Tajawal',_sans-serif] pb-16">
              
              <header className="bg-[#0A261A] text-white shadow-xl sticky top-0 z-50 border-b-4 border-[#D4AF37]">
                <div className="max-w-7xl mx-auto px-4 py-5 relative z-10">
                  <div className="flex flex-col lg:flex-row justify-between items-center gap-6">
                    <div className="flex items-center gap-4 cursor-pointer" onClick={() => handleTabChange('scholars')}>
                      <div className="bg-gradient-to-br from-[#D4AF37] to-[#B8860B] p-2.5 rounded-xl shadow-lg">
                        <i className="fas fa-landmark text-3xl text-[#0A261A]"></i>
                      </div>
                      <div>
                        <h1 className="text-2xl md:text-3xl font-extrabold tracking-wide">المدخل إلى مذهب الإمام أحمد</h1>
                        <p className="text-[#A7C8B6] text-sm mt-1 font-medium">موسوعة التراجم، المتون، وتاريخ المذهب</p>
                      </div>
                    </div>
                    
                    <nav className="flex flex-wrap justify-center gap-2">
                      {[
                        { id: 'scholars', name: 'طبقات الأعلام', icon: 'fa-users' },
                        { id: 'books', name: 'أهم المتون', icon: 'fa-book' },
                        { id: 'history', name: 'أطوار المذهب', icon: 'fa-clock' },
                        { id: 'geography', name: 'ترحال المذهب', icon: 'fa-map-marked-alt' }
                      ].map(tab => (
                        <button 
                          key={tab.id}
                          onClick={() => handleTabChange(tab.id)} 
                          className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm md:text-base font-bold transition-all ${
                            activeTab === tab.id 
                            ? 'bg-[#124930] text-[#D4AF37] shadow-inner ring-1 ring-[#D4AF37]/30' 
                            : 'text-[#E0ECE5] hover:bg-[#124930]/50'
                          }`}
                        >
                          <i className={`fas ${tab.icon}`}></i> {tab.name}
                        </button>
                      ))}
                    </nav>
                  </div>
                </div>
              </header>

              <main className="max-w-6xl mx-auto px-4 py-10 relative">
                
                {/* 1. صفحة التراجم */}
                {activeTab === 'scholars' && (
                  <div>
                    {selectedScholar ? (
                      <div>
                        <button 
                          onClick={() => setSelectedScholar(null)}
                          className="flex items-center gap-2 text-[#124930] font-bold mb-6 hover:text-[#D4AF37] transition-colors bg-white px-4 py-2 rounded-lg shadow-sm border border-gray-200 inline-flex"
                        >
                          <i className="fas fa-chevron-left"></i> العودة لقائمة الأعلام
                        </button>

                        <div className="bg-white rounded-3xl shadow-lg overflow-hidden border border-gray-100">
                          <div className="bg-gradient-to-l from-[#124930] to-[#1C6B46] p-10 relative">
                            <span className="inline-block px-4 py-1.5 bg-[#0A261A]/40 text-[#D4AF37] text-sm font-bold rounded-full mb-4 border border-[#D4AF37]/30">
                              {selectedScholar.era}
                            </span>
                            <h2 className="text-4xl md:text-5xl font-extrabold text-white mb-3 drop-shadow-md">{selectedScholar.name}</h2>
                            <p className="text-2xl text-[#A7C8B6] font-medium mb-8">{selectedScholar.title}</p>
                            <div className="inline-flex gap-4 text-white font-bold bg-black/20 px-5 py-2.5 rounded-xl">
                              <span className="flex items-center gap-2"><i className="fas fa-clock text-[#D4AF37]"></i> سنة الوفاة: {selectedScholar.death}</span>
                            </div>
                          </div>

                          <div className="p-10 font-['Amiri',_serif] space-y-10 text-[#1A3326]">
                            <div>
                              <h3 className="text-2xl font-bold text-[#124930] mb-4 flex items-center gap-2 font-['Tajawal'] border-b-2 border-gray-100 pb-3">
                                 <i className="fas fa-user text-[#D4AF37]"></i> نبذة تاريخية وعلمية
                              </h3>
                              <p className="text-xl leading-loose text-justify">{selectedScholar.bio}</p>
                            </div>

                            <div className="bg-[#F9FAF9] p-8 rounded-2xl border-r-4 border-[#D4AF37]">
                              <h3 className="text-2xl font-bold text-[#124930] mb-4 flex items-center gap-2 font-['Tajawal']">
                                <i className="fas fa-book-open text-[#D4AF37]"></i> أثر مؤلفاته في المذهب
                              </h3>
                              <p className="text-xl leading-loose text-justify font-bold text-[#2A4D3B]">{selectedScholar.worksImpact}</p>
                            </div>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div>
                        <div className="mb-10 text-center max-w-2xl mx-auto">
                          <h2 className="text-3xl font-extrabold text-[#124930] mb-4">أعلام المذهب الحنبلي</h2>
                          <div className="relative mt-8">
                            <input
                              type="text"
                              placeholder="ابحث عن عالم أو كتاب..."
                              className="w-full bg-white border-2 border-gray-200 text-[#1A3326] px-6 py-4 rounded-xl text-lg focus:outline-none focus:ring-2 focus:ring-[#124930]"
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
                            />
                            <i className="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 text-xl"></i>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                          {filteredScholars.map(scholar => (
                            <button 
                              key={scholar.id}
                              onClick={() => setSelectedScholar(scholar)}
                              className="bg-white border border-gray-200 rounded-2xl p-6 text-right shadow-sm hover:shadow-xl hover:border-[#124930] hover:-translate-y-1 transition-all group flex flex-col h-full"
                            >
                              <div className="flex justify-between items-start mb-4">
                                <span className="text-xs font-bold bg-[#F0F4F2] text-[#124930] px-2.5 py-1 rounded-md">{scholar.era.split('(')[0]}</span>
                                <span className="text-sm font-bold text-[#D4AF37] bg-[#FFFBF0] px-2.5 py-1 rounded-md border border-[#D4AF37]/20">ت {scholar.death}</span>
                              </div>
                              <h3 className="text-2xl font-extrabold text-[#1A3326] group-hover:text-[#124930] mb-2 transition-colors">{scholar.name}</h3>
                              <p className="text-[#6B8576] font-medium mb-6 text-sm">{scholar.title}</p>
                              
                              <div className="mt-auto border-t border-gray-100 pt-4 flex items-center justify-between text-[#124930] font-bold text-sm">
                                <span>عرض التفاصيل ومؤلفاته</span>
                                <i className="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
                              </div>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* 2. صفحة ترحال المذهب */}
                {activeTab === 'geography' && (
                  <div>
                    <h2 className="text-3xl md:text-4xl font-extrabold text-[#124930] mb-12 text-center">ترحال المذهب في الأمصار</h2>
                    <div className="space-y-8">
                      {geographyData.map((geo, idx) => (
                        <div key={idx} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex gap-4 items-start">
                          <div className="bg-[#124930] text-white p-3 rounded-full shrink-0">
                            <i className="fas fa-map-marked-alt text-xl"></i>
                          </div>
                          <div>
                            <div className="flex flex-wrap items-center gap-3 mb-2">
                              <h3 className="text-2xl font-bold text-[#124930]">{geo.region}</h3>
                              <span className="text-sm font-bold bg-[#F0F4F2] text-[#4A6656] px-3 py-1 rounded-full">{geo.period}</span>
                            </div>
                            <p className="text-[#4A6656] leading-relaxed mb-4 font-['Amiri',_serif] text-lg">{geo.details}</p>
                            <p className="text-sm font-bold text-[#1A3326]"><i className="fas fa-award text-[#D4AF37] ml-1"></i> أبرز الأعيان: <span className="font-normal text-[#4A6656]">{geo.icons}</span></p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 3. صفحة المتون */}
                {activeTab === 'books' && (
                  <div>
                    <h2 className="text-3xl md:text-4xl font-extrabold text-[#124930] mb-12 text-center">أهم المتون والمراجع المعتمدة</h2>
                    <div className="space-y-10">
                      {booksData.map((level, index) => (
                        <div key={index} className="bg-white border border-gray-200 p-8 rounded-3xl shadow-sm">
                          <h3 className="text-2xl font-bold text-white bg-[#124930] inline-flex px-6 py-2 rounded-xl mb-8 items-center gap-3">
                             <i className="fas fa-book-open text-[#D4AF37]"></i> {level.level}
                          </h3>
                          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            {level.items.map((book, idx) => (
                              <div key={idx} className="bg-[#F9FAF9] p-6 rounded-2xl border-r-4 border-[#D4AF37]">
                                <h4 className="text-2xl font-bold text-[#124930] mb-2">{book.name}</h4>
                                <p className="text-sm font-bold text-[#D4AF37] mb-3 bg-[#124930] inline-block px-3 py-1 rounded-md">المؤلف: {book.author}</p>
                                <p className="text-lg leading-relaxed text-[#4A6656] font-['Amiri',_serif]">{book.desc}</p>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 4. صفحة الأطوار */}
                {activeTab === 'history' && (
                  <div className="max-w-4xl mx-auto">
                    <h2 className="text-3xl md:text-4xl font-extrabold text-[#124930] mb-12 text-center">أطوار المذهب الحنبلي تاريخياً</h2>
                    <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 space-y-8">
                      {historyData.map((phase, idx) => (
                        <div key={idx} className="flex gap-4 items-start border-b border-gray-100 pb-6 last:border-0 last:pb-0">
                          <div className="w-10 h-10 rounded-full bg-[#124930] text-[#D4AF37] flex items-center justify-center font-bold text-xl shrink-0">
                            {idx + 1}
                          </div>
                          <div>
                            <h3 className="text-2xl font-bold text-[#1A3326] mb-2">{phase.phase}</h3>
                            <p className="text-xl leading-relaxed text-[#4A6656] font-['Amiri',_serif]">{phase.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HanbaliIntro />);
    </script>
</body>
</html>
